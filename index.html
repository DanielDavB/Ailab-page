<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ai Enterprise — Automatización con IA para PyMEs</title>
<meta name="description" content="Consultoría y automatización con IA para pequeñas y medianas empresas en México y LATAM. Diagnóstico, agentes de IA, automatización de procesos y capacitación.">
<link rel="stylesheet" href="assets/ds/styles.css?v=2">
<style>body{background:var(--bg)}#root{min-height:100vh}
@keyframes ail-marquee{to{transform:translateX(-50%)}}
.ail-marquee:hover .ail-marquee-track{animation-play-state:paused}
.ail-marquee-item:hover{color:#F5F5F5}
@keyframes ail-drop{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
header{animation:ail-drop .6s cubic-bezier(.2,.7,.2,1) both}
#ail-progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--orange);z-index:60;transition:width .1s linear}
button,a{transition:color .25s ease,background .25s ease,border-color .25s ease,transform .25s cubic-bezier(.2,.7,.2,1)}
.ail-auto{opacity:0;transform:translateY(24px);filter:blur(5px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1),filter .7s ease;will-change:opacity,transform}
.ail-auto.ail-in{opacity:1;transform:none;filter:none}
/* Texto: palabras que suben con blur, caret de terminal */
@keyframes ail-word-in{from{opacity:0;transform:translateY(.45em);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.ail-word{display:inline-block;animation:ail-word-in .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes ail-blink{50%{opacity:0}}
.ail-caret{display:inline-block;width:.55em;height:1.05em;margin-left:2px;vertical-align:-.15em;animation:ail-blink 1s steps(1) infinite}
/* Aurora del hero */
@keyframes ail-drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.12)}100%{transform:translate(0,0) scale(1)}}
.ail-blob{position:absolute;border-radius:50%;filter:blur(10px);animation:ail-drift 16s ease-in-out infinite}
.ail-blob-b{animation-duration:21s;animation-direction:reverse}
.ail-blob-c{animation-duration:26s}
/* Pulso de estado */
@keyframes ail-ping-k{0%{box-shadow:0 0 0 0 rgba(255,103,0,.6)}100%{box-shadow:0 0 0 12px rgba(255,103,0,0)}}
.ail-ping{animation:ail-ping-k 1.4s ease-out infinite}
@keyframes ail-pop-k{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.25)}100%{transform:none}}
/* Demo de flujo (sidebar + stage) */
.ail-flow{display:grid;grid-template-columns:minmax(0,38fr) minmax(0,62fr);gap:24px;margin-top:64px;font-family:var(--font-mono)}
.ail-flow-side{display:flex;flex-direction:column;gap:16px}
.ail-flow-item{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:12px 14px;border:1px solid var(--gray-800);border-radius:6px;background:#111;color:var(--gray-500);cursor:pointer;font-family:var(--font-mono)}
.ail-flow-item:hover{border-color:var(--gray-600)}
.ail-flow-num{font-size:13px;font-weight:700;width:22px;flex:none}
.ail-flow-title{display:block;font-size:14px;font-weight:700;color:inherit}
.ail-flow-sub{display:block;margin-top:3px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ail-flow-tag{flex:none;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border:1px solid currentColor;border-radius:4px;opacity:.8}
.ail-flow-active{background:var(--orange);border-color:var(--orange);color:#0D0D0D;box-shadow:0 10px 30px -12px rgba(255,103,0,.7)}
.ail-flow-active .ail-flow-sub,.ail-flow-active .ail-flow-tag{opacity:1}
.ail-flow-done{color:#D0D0D0}
.ail-flow-done .ail-flow-num,.ail-flow-done .ail-flow-tag{color:#3CE8B0}
.ail-flow-done .ail-flow-tag{animation:ail-pop-k .45s cubic-bezier(.2,.9,.3,1.3) both}
.ail-flow-ctrl{display:flex;gap:8px}
.ail-flow-ctrl button{flex:1;padding:10px 8px;background:none;border:1px solid var(--gray-800);border-radius:6px;color:var(--gray-400);font:700 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.ail-flow-ctrl button:hover:not(:disabled){border-color:var(--orange);color:#F5F5F5}
.ail-flow-ctrl button:disabled{opacity:.35;cursor:default}
.ail-flow-stage{position:relative;border:1px solid #3a1a10;border-radius:8px;background:radial-gradient(120% 80% at 100% 0%,rgba(255,103,0,.08),transparent 55%),#0A0A0A;overflow:hidden;display:flex;flex-direction:column}
.ail-flow-bar{display:flex;align-items:center;gap:6px;padding:12px 16px;border-bottom:1px solid #1f1f1f;font-size:11px;letter-spacing:.06em}
.ail-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.ail-flow-cmd{font-size:clamp(14px,1.6vw,19px);color:#F5F5F5;min-height:1.6em;white-space:nowrap;overflow:hidden}
.ail-flow-track{margin-top:12px;height:2px;background:#1f1f1f;overflow:hidden}
@keyframes ail-fill-k{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ail-flow-fill{height:100%;transform-origin:left;animation:ail-fill-k linear forwards;transition:background .4s ease}
.ail-flow-svg{display:block;width:100%;height:auto;padding:8px 6px}
.ail-flow-node{transform-box:fill-box;transform-origin:center}
@keyframes ail-halo-k{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}
.ail-flow-halo{transform-box:fill-box;transform-origin:center;animation:ail-halo-k 1.6s ease-out infinite}
.ail-flow-t-num{font:700 13px var(--font-mono);letter-spacing:.08em;text-transform:uppercase}
.ail-flow-t-label{font:700 22px var(--font-mono)}
.ail-flow-t-meta{font:400 13px var(--font-mono);fill:#7A7A7A}
.ail-flow-foot{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;border-top:1px solid #1f1f1f;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-600);margin-top:auto}
@media (max-width:900px){.ail-flow{grid-template-columns:1fr}.ail-flow-side{order:2}.ail-flow-foot span:first-child{display:none}}
/* Barra del portal */
.ail-bar-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-bright));position:relative;overflow:hidden;transition:width 1.6s cubic-bezier(.2,.7,.2,1)}
@keyframes ail-shine-k{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.ail-bar-fill::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:ail-shine-k 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ail-auto{opacity:1!important;transform:none!important;filter:none!important}}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="assets/ds/ds-bundle.js?v=2"></script>
<script src="data.js?v=2"></script>
</head>
<body>
<div id="ail-progress"></div>
<div id="root"></div>
<script>addEventListener('scroll',function(){var h=document.documentElement;var p=h.scrollTop/((h.scrollHeight-h.clientHeight)||1);var el=document.getElementById('ail-progress');if(el)el.style.width=(p*100)+'%'},{passive:true});</script>
<script type="text/babel" src="assets/js/Motion.jsx?v=2"></script>
<script type="text/babel" src="assets/js/Chrome.jsx?v=2"></script>
<script type="text/babel" src="assets/js/FlowDemo.jsx?v=2"></script>
<script type="text/babel" src="assets/js/HomeScreen.jsx?v=2"></script>
<script type="text/babel" src="assets/js/ServicesScreen.jsx?v=2"></script>
<script type="text/babel" src="assets/js/CasesScreen.jsx?v=2"></script>
<script type="text/babel" src="assets/js/InnerScreens.jsx?v=2"></script>
<script type="text/babel" src="assets/js/ContactScreen.jsx?v=2"></script>
<script type="text/babel">
const { Dialog, Toast, Button, Input } = window.AiLabDesignSystem_1d6ea7;

/* Rutas simples vía hash, para poder compartir/recargar una página del sitio (#servicios, #casos, etc). */
function routeFromHash(){
  const h = (window.location.hash || '').replace('#','');
  return h || 'home';
}

function App(){
  const [route,setRoute]=React.useState(routeFromHash());
  const [slug,setSlug]=React.useState('distribuidora');
  const [dialog,setDialog]=React.useState(false);
  const [toast,setToast]=React.useState(null);
  const go=(r)=>{
    if(r==='login'){ window.location.href='portal/index.html'; return; }
    setRoute(r);
    if(window.location.hash.replace('#','') !== r) window.location.hash = r === 'home' ? '' : r;
    window.scrollTo(0,0);
  };
  React.useEffect(()=>{
    const onHash=()=>setRoute(routeFromHash());
    window.addEventListener('hashchange', onHash);
    return ()=>window.removeEventListener('hashchange', onHash);
  },[]);
  const openCase=(s)=>{setSlug(s);go('caso');};
  const confirm=(who)=>{setDialog(false);go('home');setToast('Diagnóstico agendado · '+who);setTimeout(()=>setToast(null),4000);};
  return (<>
    <Header route={route} onNavigate={go} onCta={()=>setDialog(true)} onLogin={()=>go('login')} />
    {route==='home' && <HomeScreen onNavigate={go} onCase={openCase} onCta={()=>setDialog(true)} onLogin={()=>go('login')} />}
    {route==='servicios' && <ServicesScreen onCta={()=>go('contacto')} />}
    {route==='casos' && <CasesScreen onCase={openCase} />}
    {route==='caso' && <CaseDetailScreen slug={slug} onBack={()=>go('casos')} onCta={()=>go('contacto')} />}
    {route==='metodologia' && <MethodScreen onCta={()=>go('contacto')} />}
    {route==='academia' && <AcademyScreen onCta={()=>go('contacto')} />}
    {route==='nosotros' && <AboutScreen onCta={()=>go('contacto')} />}
    {route==='contacto' && <ContactScreen onSubmit={confirm} />}
    {route==='privacidad' && <PrivacyScreen />}
    <Footer onNavigate={go} />
    <Dialog open={dialog} title="Agendar diagnóstico" onClose={()=>setDialog(false)}
      footer={<><Button variant="secondary" onClick={()=>setDialog(false)}>Cancelar</Button><Button variant="accent" onClick={()=>confirm('hola@empresa.com')}>Enviar</Button></>}>
      <p style={{marginBottom:24}}>Déjanos tu correo y te enviamos 3 horarios disponibles esta semana.</p>
      <Input label="Correo de trabajo" placeholder="nombre@empresa.com" />
    </Dialog>
    {toast && <div style={{position:'fixed',right:24,bottom:24,zIndex:200}}><Toast tone="success" message="Diagnóstico agendado" detail={toast} onDismiss={()=>setToast(null)} /></div>}
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

/* Auto-reveal para las pantallas que no traen <Reveal> propio */
if(!window.REDUCED){
  const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('ail-in');io.unobserve(e.target);}})},{threshold:.1,rootMargin:'0px 0px -6% 0px'});
  const scan=()=>{
    document.querySelectorAll('#root section > div > *').forEach((el)=>{
      if(el.dataset.ailAuto||el.hasAttribute('data-reveal')||el.closest('[data-reveal]')||el.querySelector('[data-reveal]')||el.tagName==='CANVAS'||el.classList.contains('ail-flow'))return;
      el.dataset.ailAuto='1';
      const sibs=[...el.parentElement.children].filter(x=>x.dataset.ailAuto);
      el.style.transitionDelay=(Math.min(sibs.indexOf(el),6)*80)+'ms';
      el.classList.add('ail-auto');
      io.observe(el);
      setTimeout(()=>el.classList.add('ail-in'),700);
    });
  };
  const root=document.getElementById('root');
  new MutationObserver(()=>requestAnimationFrame(scan)).observe(root,{childList:true,subtree:true});
  setTimeout(scan,120);
}
</script>
</body></html>
